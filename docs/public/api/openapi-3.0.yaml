openapi: 3.0.0
info:
  contact:
    name: Homebox Team
    url: https://discord.homebox.software
  description: Track, Manage, and Organize your Things.
  title: Homebox API
  version: "1.0"
paths:
  /v1/actions/create-missing-thumbnails:
    post:
      description: Creates thumbnails for items that are missing them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Create Missing Thumbnails
      tags:
        - Actions
  /v1/actions/ensure-asset-ids:
    post:
      description: Ensures all items in the database have an asset ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Ensure Asset IDs
      tags:
        - Actions
  /v1/actions/ensure-import-refs:
    post:
      description: Ensures all items in the database have an import ref
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Ensures Import Refs
      tags:
        - Actions
  /v1/actions/set-primary-photos:
    post:
      description: Sets the first photo of each item as the primary photo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Set Primary Photos
      tags:
        - Actions
  /v1/actions/wipe-inventory:
    post:
      description: Deletes all items in the inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.WipeInventoryOptions"
        description: Wipe options
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Wipe Inventory
      tags:
        - Actions
  /v1/actions/zero-item-time-fields:
    post:
      description: Resets all item date fields to the beginning of the day
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
      security:
        - Bearer: []
      summary: Zero Out Time Fields
      tags:
        - Actions
  /v1/ai/capture/analyze:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  description: Inventory photos (repeat field for multiple photos)
                  type: string
                  format: binary
                locationId:
                  description: Selected HomeBox location UUID
                  type: string
                instruction:
                  description: Correction request
                  type: string
                draft:
                  description: Current AI draft JSON
                  type: string
              required:
                - photos
                - locationId
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureDraft"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
      security:
        - Bearer: []
      summary: Analyze inventory photos with an OpenAI-compatible vision model
      tags:
        - AI Capture
  /v1/ai/capture/sessions:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.Results-services_AICaptureSessionOut"
      security:
        - Bearer: []
      summary: List the current user's AI capture sessions
      tags:
        - AI Capture Sessions
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionCreate"
        description: Selected location
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Create an AI capture session
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}":
    delete:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: Delete an AI capture session
      tags:
        - AI Capture Sessions
    get:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Get an AI capture session
      tags:
        - AI Capture Sessions
    patch:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionLocationUpdate"
        description: Replacement location
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Change an AI capture session location
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/corrections":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionCorrection"
        description: Correction instruction
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Ask AI to correct a persisted capture draft
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/draft":
    put:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionDraftUpdate"
        description: Draft and expected revision
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Save an edited AI capture draft
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/finish":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionFinish"
        description: Expected uploaded count
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Seal an AI capture session and queue analysis
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/photos":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: Normalized image
                  type: string
                  format: binary
                clientPhotoId:
                  description: Client idempotency UUID
                  type: string
                position:
                  description: Capture order
                  type: integer
                captureGroupId:
                  description: Same-item group UUID
                  type: string
              required:
                - file
                - clientPhotoId
                - position
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionPhoto"
      security:
        - Bearer: []
      summary: Upload one photo to an AI capture session
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/photos/{photoId}":
    delete:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: Capture photo ID
          in: path
          name: photoId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: Delete a photo from a capturing session
      tags:
        - AI Capture Sessions
    get:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: Capture photo ID
          in: path
          name: photoId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
      security:
        - Bearer: []
      summary: Read an authorized AI capture session photo
      tags:
        - AI Capture Sessions
    patch:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: Capture photo ID
          in: path
          name: photoId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionPhotoUpdate"
        description: Nullable same-item group UUID
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionPhoto"
      security:
        - Bearer: []
      summary: Reassign or clear a photo's same-item group
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/reanalysis/{clientId}":
    delete:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: Draft client ID
          in: path
          name: clientId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Dismiss a durable capture-item reanalysis result
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/reanalyze-item":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionReanalysis"
        description: Reviewed item and provider
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureReanalysisOut"
      security:
        - Bearer: []
      summary: Preview provider reanalysis for one reviewed capture item
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/reanalyze-items":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionReanalysisBatch"
        description: Reviewed items and provider
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Queue durable provider reanalysis for reviewed capture items
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/retry-analysis":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Retry failed AI capture analysis
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/submit":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionSubmit"
        description: Expected draft revision
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Create reviewed items from an AI capture session
      tags:
        - AI Capture Sessions
  "/v1/ai/capture/sessions/{sessionId}/submit-items":
    post:
      parameters:
        - description: Capture session ID
          in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiCaptureSessionItemsSubmit"
        description: Expected draft revision and selected item IDs
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AICaptureSessionOut"
      security:
        - Bearer: []
      summary: Create selected reviewed items from an AI capture session
      tags:
        - AI Capture Sessions
  "/v1/ai/items/{id}/reanalyze":
    post:
      parameters:
        - description: Item ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.aiItemReanalysisRequest"
        description: Optional visual-analysis guidance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.AIItemReanalysisOut"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
      security:
        - Bearer: []
      summary: Preview Qwen reanalysis for an existing inventory item
      tags:
        - AI Capture
  "/v1/assets/{id}":
    get:
      parameters:
        - description: Asset ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.PaginationResult-repo_EntitySummary"
      security:
        - Bearer: []
      summary: Get Item by Asset ID
      tags:
        - Items
  /v1/currencies:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/currencies.Currency"
      summary: Currency
      tags:
        - Base
  /v1/entities:
    get:
      parameters:
        - description: search string
          in: query
          name: q
          schema:
            type: string
        - description: page number
          in: query
          name: page
          schema:
            type: integer
        - description: items per page
          in: query
          name: pageSize
          schema:
            type: integer
        - description: tags Ids
          in: query
          name: tags
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: parent Ids
          in: query
          name: parentIds
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityListResult"
      security:
        - Bearer: []
      summary: Query All Entities
      tags:
        - Entities
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityCreate"
        description: Entity Data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Create Entity
      tags:
        - Entities
  "/v1/entities/{id}":
    delete:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: Delete Entity
      tags:
        - Entities
    get:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Get Entity
      tags:
        - Entities
    patch:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityPatch"
        description: Entity Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Patch Entity
      tags:
        - Entities
    put:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityUpdate"
        description: Entity Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Update Entity
      tags:
        - Entities
  "/v1/entities/{id}/attachments":
    post:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: File attachment
                  type: string
                  format: binary
                type:
                  description: Type of file
                  type: string
                primary:
                  description: Is this the primary attachment
                  type: boolean
                name:
                  description: name of the file including extension
                  type: string
              required:
                - file
                - name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
      security:
        - Bearer: []
      summary: Create Entity Attachment
      tags:
        - Entities Attachments
  "/v1/entities/{id}/attachments/{attachment_id}":
    delete:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Attachment ID
          in: path
          name: attachment_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: Delete Entity Attachment
      tags:
        - Entities Attachments
    get:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Attachment ID
          in: path
          name: attachment_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
        - Bearer: []
      summary: Get Entity Attachment
      tags:
        - Entities Attachments
    put:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Attachment ID
          in: path
          name: attachment_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.ItemAttachmentUpdate"
        description: Attachment Update
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Update Entity Attachment
      tags:
        - Entities Attachments
  "/v1/entities/{id}/attachments/external":
    post:
      description: Links an entity to a document or URL in an external system without
        copying
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.externalAttachmentRequest"
        description: External document reference
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
      security:
        - Bearer: []
      summary: Create External Link Attachment
      tags:
        - Entities Attachments
  "/v1/entities/{id}/duplicate":
    post:
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.DuplicateOptions"
        description: Duplicate Options
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
      security:
        - Bearer: []
      summary: Duplicate Entity
      tags:
        - Entities
  "/v1/entities/{id}/maintenance":
    get:
      parameters:
        - description: Item ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: status
          x-enum-varnames:
            - MaintenanceFilterStatusScheduled
            - MaintenanceFilterStatusCompleted
            - MaintenanceFilterStatusBoth
          schema:
            type: string
            enum:
              - scheduled
              - completed
              - both
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/repo.MaintenanceEntryWithDetails"
                type: array
      security:
        - Bearer: []
      summary: Get Maintenance Log
      tags:
        - Item Maintenance
    post:
      parameters:
        - description: Item ID
          in: path
          name: id
          required: true
          schema:
            type: string
