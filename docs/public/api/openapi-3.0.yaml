              schema:
                type: string
        "403":
          description: demo mode is enabled or local login is disabled
          content:
            application/json:
              schema:
                type: string
        "500":
          description: internal error while processing the request
          content:
            application/json:
              schema:
                type: string
      summary: Request Password Reset
      tags:
        - Authentication
  /v1/users/login:
    post:
      parameters:
        - description: auth provider
          in: query
          name: provider
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/v1.LoginForm"
          application/json:
            schema:
              $ref: "#/components/schemas/v1.LoginForm"
        description: Login Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.TokenResponse"
      summary: User Login
      tags:
        - Authentication
  /v1/users/login/oidc:
    get:
      responses:
        "302":
          description: Found
      summary: OIDC Login Initiation
      tags:
        - Authentication
  /v1/users/login/oidc/callback:
    get:
      parameters:
        - description: Authorization code
          in: query
          name: code
          required: true
          schema:
            type: string
        - description: State parameter
          in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Found
      summary: OIDC Callback Handler
      tags:
        - Authentication
  /v1/users/logout:
    post:
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: User Logout
      tags:
        - Authentication
  /v1/users/logout/all:
    post:
      description: |-
        Revokes every session token for the authenticated user across all
        devices, including the current one. Use this to invalidate a session
        token that may have been leaked or stolen. API keys are stored
        separately and are not affected; revoke them from the API keys page.
      responses:
        "204":
          description: No Content
      security:
        - Bearer: []
      summary: Log Out Of All Sessions
      tags:
        - Authentication
  /v1/users/refresh:
    get:
      description: >-
        handleAuthRefresh returns a handler that will issue a new token from an
        existing token.

        This does not validate that the user still exists within the database.
      responses:
        "200":
          description: OK
      security:
        - Bearer: []
      summary: User Token Refresh
      tags:
        - Authentication
  /v1/users/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/services.UserRegistration"
        description: User Data
        required: true
      responses:
        "204":
          description: No Content
        "403":
          description: Local login is not enabled
          content:
            application/json:
              schema:
                type: string
      summary: Register New User
      tags:
        - User
  /v1/users/reset-password:
    post:
      description: |-
        Consumes a single-use reset token and changes the user's password.
        On success, all existing sessions for the user are revoked.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.ResetPasswordRequest"
        description: Token + new password
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request body, password shorter than the minimum length, or
            token that is invalid / expired / already used
          content:
            application/json:
              schema:
                type: string
        "403":
          description: demo mode is enabled or local login is disabled
          content:
            application/json:
              schema:
                type: string
        "500":
          description: internal error while processing the request
          content:
            application/json:
              schema:
                type: string
      summary: Reset Password
      tags:
        - Authentication
